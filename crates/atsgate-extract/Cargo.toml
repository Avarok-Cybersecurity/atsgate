[package]
name = "atsgate-extract"
description = "Pure extraction of resume documents (PDF, DOCX, HTML, Markdown, text) into spans and layout signals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
lopdf = { version = "0.47.0", default-features = false }
pdf_oxide = { version = "=0.3.78", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false }
quick-xml = "0.42.0"
scraper = "0.29.0"
thiserror = "2.0.21"
zip = { version = "=9.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
