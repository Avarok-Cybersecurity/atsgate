# ATSGate curated alias table (part of this crate's code: MIT OR Apache-2.0).
#
# - skills / titles: `ref` names an imported concept (renamed to `canonical`, `aliases` added) or a
#   new `atsgate:` concept the imported taxonomies lack, linked into them through `broader`.
# - contextual_titles: titles that name an occupation only inside an O*NET-SOC group.
# - denied_aliases: imported aliases that are wrong for their concept.
# - case_sensitive: phrases that are also ordinary words; in free text they match only with this
#   exact capitalization and never as the first word of a sentence.
# - gazetteer_stoplist: phrases too generic to report as a requirement on their own.
# - gazetteer_esco_allow: ESCO names a postings gazetteer reports although they are one word or
#   an alternative label (it otherwise keeps only multi-word ESCO preferred labels).
# - gazetteer_posting_excluded_prefixes: opening words of ESCO transversal and attitude labels,
#   which a postings gazetteer never reports (the ESCO data embedded here has no skill type).
# Every `ref` must exist; loading fails otherwise.
