titles:
  # O*NET labels are plural and its reported titles omit the singular.
  - { canonical: Data Scientists, ref: "onet-soc:15-2051.00", aliases: [Data Scientist], broader: [] }
  # O*NET lists neither spelling; "backend" is a specialization of software development.
  - { canonical: Software Developers, ref: "onet-soc:15-1252.00", aliases: [Backend Engineer, Back-end Engineer], broader: [] }
# Titles that name an occupation only in context. A bare "Engineer" (after seniority words are
# removed: "Staff Engineer", "Principal Engineer") or "Systems Engineer" is a software title when
# the occupation it is read against (the blueprint's, or the one a posting's skills point to)
# is a computer occupation (O*NET-SOC 15-12xx); elsewhere O*NET's own reading stands.
contextual_titles:
  - { title: Engineer, group: "15-12", ref: "onet-soc:15-1252.00" }
  - { title: Developer, group: "15-12", ref: "onet-soc:15-1252.00" }
