[package]
name = "atsgate-cli"
description = "The atsgate command line: the I/O boundary around the pure ATSGate crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
atsgate-blueprint.workspace = true
atsgate-career.workspace = true
atsgate-extract.workspace = true
atsgate-render.workspace = true
atsgate-score.workspace = true
atsgate-taxonomy.workspace = true
serde_json = "1.0.154"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
atsgate-render.workspace = true

[[bin]]
name = "atsgate"
path = "src/main.rs"
