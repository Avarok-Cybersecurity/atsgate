name: deploy

# GeoHarness (https://github.com/Avarok-Cybersecurity/geoharness) builds site/ (node build.mjs), writes
# markdown twins, llms.txt, the sitemap and robots.txt Content Signals, gates on a GEO score of 90 and on
# 100 in all four Lighthouse categories, deploys an assets-only Cloudflare Worker on ats.express,
# configures the zone and verifies the live site, rolling back if the live checks fail.
# Pull requests run the same pipeline with deploy: false: no secrets, no Cloudflare API call, no zone change.
# Settings live in site/geoharness.toml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build, gate, deploy, verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Never cancel a deploy half way: runs for main queue behind each other.
    concurrency:
      group: deploy-ats.express
      cancel-in-progress: false
    environment:
      name: production
      url: https://ats.express
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: GeoHarness dates pages from git (content.sources); a shallow clone dates every page HEAD.
          fetch-depth: 0
      - name: GeoHarness (deploy)
        id: geoharness
        uses: Avarok-Cybersecurity/geoharness@1d44cf1ee4b77dda12f9946a58b151efb730602d # main
        with:
          cloudflare-api-token: ${{ secrets.GEOHARNESS_CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          site-path: site
          adapter: command
          build-command: node build.mjs
          output-dir: dist
          target: workers
          project-name: atsgate-site
          domains: ats.express
          lighthouse: "true"
          # Every processed page (the sitemap is alphabetical, so 8 covered only blueprint pages).
          lighthouse-max-urls: "22"
          geo-min-score: "90"
          # ats.express is a zone of its own, so every zone-wide optimization is ours to set.
          extra-optimizations: all
          deploy: "true"
          # A build that fails the live GEO audit or the production Lighthouse gate is replaced by the previous one.
          rollback-on-failure: "true"
      - name: Result
        env:
          GEO_SCORE: ${{ steps.geoharness.outputs.geo-score }}
          URL: ${{ steps.geoharness.outputs.url }}
        run: echo "GEO score $GEO_SCORE at $URL"

  dry-run:
    name: Build and gate (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-dry-run-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: GeoHarness (dry run, deploy false)
        id: geoharness
        uses: Avarok-Cybersecurity/geoharness@1d44cf1ee4b77dda12f9946a58b151efb730602d # main
        with:
          site-path: site
          adapter: command
          build-command: node build.mjs
          output-dir: dist
          target: workers
          project-name: atsgate-site
          domains: ats.express
          lighthouse: "true"
          lighthouse-max-urls: "22"
          geo-min-score: "90"
          extra-optimizations: all
          deploy: "false"
      - name: Result
        env:
          GEO_SCORE: ${{ steps.geoharness.outputs.geo-score }}
        run: echo "GEO score (build) $GEO_SCORE"
