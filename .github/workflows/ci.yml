name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: README citations match CITATIONS.md
        run: cargo run -p xtask --locked -- citations --check
      - name: committed fixtures match the generator
        run: cargo run -p xtask --locked -- fixtures --check
      - name: committed JSON Schemas match the Rust types
        run: cargo run -p xtask --locked -- schemas --check
      - name: embedded taxonomy data matches its pins, credits and size budget
        run: cargo run -p xtask --locked -- taxonomy --verify
      - name: committed example blueprints match the generator
        run: cargo run -p xtask --locked -- examples --check
      - name: site data (scoring tables, blueprints, schema, action, citations) matches the code
        run: cargo run -p xtask --locked -- site --check

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  action:
    # The composite action, run the way a consumer runs it, built from this checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      ZERO_FLOORS: "workday=0, taleo=0, icims=0, greenhouse=0, lever=0, successfactors=0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: score mode
        id: score
        uses: ./
        with:
          mode: score
          resume: fixtures/pdf/one-column.pdf
          blueprint: builtin:software-engineer-backend
          floors: ${{ env.ZERO_FLOORS }}
          fail-on-integrity-flags: "true"
          report: ${{ runner.temp }}/score/report.json
      - name: score mode reported a pass for exactly the fixture
        env:
          PASSED: ${{ steps.score.outputs.passed }}
          SHA: ${{ steps.score.outputs.resume-sha256 }}
          REPORT: ${{ steps.score.outputs.report-json }}
          MIN: ${{ steps.score.outputs.min-vendor-score }}
        run: |
          test "$PASSED" = true
          test "$SHA" = "$(sha256sum fixtures/pdf/one-column.pdf | cut -d' ' -f1)"
          test "$(jq -r .report.label "$REPORT")" = "simulated parse and keyword risk"
          test "$(jq '.report.vendors | length' "$REPORT")" = 6
          test "$(jq -r .verdict.min_vendor_score "$REPORT")" = "$MIN"
          test -s "${REPORT%.json}.md"
      - name: gate mode
        id: gate
        uses: ./
        with:
          mode: gate
          career: fixtures/career/synthetic.career.json
          career-format: atsgate
          tailoring: fixtures/tailoring/synthetic.yaml
          contact: public
          out: ${{ runner.temp }}/gate/dist
          blueprint: builtin:software-engineer-backend
          floors: ${{ env.ZERO_FLOORS }}
          fail-on-integrity-flags: "true"
          report: ${{ runner.temp }}/gate/report.json
      - name: gate mode scored the PDF it shipped
        env:
          PASSED: ${{ steps.gate.outputs.passed }}
          SHA: ${{ steps.gate.outputs.resume-sha256 }}
          PDF: ${{ steps.gate.outputs.resume-pdf }}
          DOCX: ${{ steps.gate.outputs.resume-docx }}
          PARTIALS: ${{ steps.gate.outputs.partials-dir }}
        run: |
          test "$PASSED" = true
          test "$SHA" = "$(sha256sum "$PDF" | cut -d' ' -f1)"
          test -s "$DOCX"
          test -d "$PARTIALS"
      - name: gate mode imports a tbraun96 career file first
        id: imported
        uses: ./
        with:
          mode: gate
          career: fixtures/import/tbraun96-career.json
          career-format: tbraun96
          tailoring: fixtures/tailoring/tbraun96-general.yaml
          contact: public
          out: ${{ runner.temp }}/imported/dist
          blueprint: builtin:software-engineer-systems-rust
          fail-on-integrity-flags: "true"
          report: ${{ runner.temp }}/imported/report.json
      - name: the imported career rendered and passed the default floors
        env:
          PASSED: ${{ steps.imported.outputs.passed }}
          PDF: ${{ steps.imported.outputs.resume-pdf }}
        run: |
          test "$PASSED" = true
          test -s "$PDF"
      - name: hidden text fails the gate (expected to fail)
        id: hidden
        continue-on-error: true
        uses: ./
        with:
          mode: score
          resume: fixtures/docx/hidden-white.docx
          blueprint: builtin:software-engineer-backend
          floors: ${{ env.ZERO_FLOORS }}
          fail-on-integrity-flags: "true"
          report: ${{ runner.temp }}/hidden/report.json
      - name: the hidden-text step failed, and for the integrity flag
        env:
          OUTCOME: ${{ steps.hidden.outcome }}
          PASSED: ${{ steps.hidden.outputs.passed }}
          REPORT: ${{ runner.temp }}/hidden/report.json
        run: |
          test "$OUTCOME" = failure
          test "$PASSED" = false
          test "$(jq -r .verdict.passed "$REPORT")" = false
          test "$(jq -r '.verdict.reasons[0]' "$REPORT")" = "integrity flag: integrity.hidden.white"
