name: release

# Builds the atsgate binary for each runner the action supports, attests where each was built,
# and attaches it with its .sha256 to the GitHub release of the tag. The action pins those
# hashes in action/release-pins.txt in a commit after the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            exe: atsgate
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            exe: atsgate
          - target: aarch64-apple-darwin
            os: macos-latest
            exe: atsgate
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: atsgate.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustc --version
      - name: build
        shell: bash
        run: cargo build --release --locked -p atsgate-cli --target "${{ matrix.target }}"
      - name: name the asset and hash it
        shell: bash
        env:
          ASSET: ${{ matrix.exe == 'atsgate.exe' && format('atsgate-{0}.exe', matrix.target) || format('atsgate-{0}', matrix.target) }}
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/$ASSET"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
          cat "$ASSET.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/atsgate-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: every asset matches its hash
        working-directory: dist
        run: |
          ls -l
          set -- ./*.sha256
          test "$#" -eq 4
          sha256sum --check -- "$@"
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --verify-tag --title "$TAG" \
              --notes "Binaries for the ATSGate action. Verify with: gh attestation verify <file> --repo $REPO"
          fi
