[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Avarok-Cybersecurity/atsgate"
homepage = "https://ats.express"
authors = ["Avarok Cybersecurity"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
atsgate-extract = { path = "crates/atsgate-extract", version = "0.1.0" }
atsgate-resume = { path = "crates/atsgate-resume", version = "0.1.0" }
atsgate-blueprint = { path = "crates/atsgate-blueprint", version = "0.1.0" }
atsgate-career = { path = "crates/atsgate-career", version = "0.1.0" }
atsgate-taxonomy = { path = "crates/atsgate-taxonomy", version = "0.1.0" }
atsgate-render = { path = "crates/atsgate-render", version = "0.1.0" }
atsgate-score = { path = "crates/atsgate-score", version = "0.1.0" }
