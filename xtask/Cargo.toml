[package]
name = "xtask"
description = "Repository maintenance tasks for ATSGate (generated sections, fixtures, schemas)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lopdf = { version = "0.47.0", default-features = false }
zip = { version = "=9.4.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
atsgate-career.workspace = true
atsgate-extract.workspace = true
atsgate-resume.workspace = true
atsgate-blueprint.workspace = true
atsgate-score.workspace = true
atsgate-taxonomy.workspace = true
csv = "1.4.0"
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "=2.1.1"
sha2 = "0.11.0"
