# cargo-deny configuration. Copyleft licenses (GPL, AGPL, LGPL) are not allowed: they are simply
# absent from `allow`, so any crate that uses one fails the check (this also rules out mupdf).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) transitive dependencies of pdf_oxide. Revisit on each pdf_oxide bump.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; reached only through pdf_oxide" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; reached only through pdf_oxide" },
    # Transitive dependencies of typst 0.15.1 (atsgate-render), which has no features to drop them.
    # The renderer evaluates one built-in template; career data reaches it only as JSON strings, never
    # as markup, so bibliographies (hayagriva, citationberg, biblatex), code highlighting (syntect)
    # and YAML loading are never invoked. Revisit on each typst bump.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 via citationberg: CSL styles are never parsed; the template has no bibliography" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 via citationberg: CSL styles are never parsed; the template has no bibliography" },
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained; reached only through typst (syntect)" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; reached only through typst (biblatex)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained; reached only through typst (krilla, usvg)" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; reached only through typst (hayagriva)" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust is unmaintained; reached only through typst (syntect)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The list is the policy; not every allowed license is in use today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
]

# MPL-2.0 is file-level copyleft, not GPL-family: using these crates unmodified leaves ATSGate
# MIT OR Apache-2.0. They arrive only through `scraper` (HTML parsing). No other MPL crate is allowed.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    # Public-domain-equivalent, reached only through typst (biblatex). Allowed for this crate only.
    { allow = ["0BSD", "CC0-1.0"], crate = "roman-numerals-rs" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
